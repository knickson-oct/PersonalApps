name: Build Desktop Timer (Windows)

on:
  push:
    branches:
      - '**'
    paths:
      - 'DesktopTimerApp/**'
      - '.github/workflows/build-desktop-timer.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DesktopTimerApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-timer-windows
          path: |
            DesktopTimerApp/dist/*.exe
          retention-days: 30
